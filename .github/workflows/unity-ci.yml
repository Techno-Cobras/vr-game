name: Unity CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Validate repository policy
        shell: pwsh
        run: ./scripts/Test-RepositoryPolicy.ps1

  unity:
    name: Unity tests and Android smoke build
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Check Unity activation configuration
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          if [[ -n "$UNITY_LICENSING_SERVER" ]]; then
            exit 0
          fi
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Unity activation is not configured. Add UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro), or UNITY_LICENSING_SERVER. See docs/CI.md.'
            exit 1
          fi
      - name: EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          cliVersion: v0.1.72
          testMode: all
          coverageEnabled: false
          artifactsPath: Logs/TestResults
          githubToken: ''
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}
      - name: Startup smoke and Android build
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          buildMethod: VrGame.Editor.BuildAutomation.BuildAndroid
          versioning: None
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}
      - name: Upload test results, logs and APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Logs/
            artifacts/
            Builds/Android/*.apk
            build/**/*.log
          if-no-files-found: warn
          retention-days: 14
